<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講義室予約管理システム</title>
    <?!= include('css'); ?>
</head>
<body>
    <div id="app">
        <!-- ヘッダー -->
        <header class="header">
            <div class="container">
                <h1 class="title">講義室予約管理システム</h1>
                <div class="header-controls">
                    <button id="prevWeek" class="btn btn-secondary">＜ 前週</button>
                    <span id="currentWeek" class="current-week"></span>
                    <button id="nextWeek" class="btn btn-secondary">次週 ＞</button>
                    <button id="addBookingBtn" class="btn btn-primary">予約追加</button>
                </div>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main">
            <div class="container">
                <!-- 凡例 -->
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3B82F6;"></div>
                        <span>講義</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #EF4444;"></div>
                        <span>試験</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #10B981;"></div>
                        <span>セミナー</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #F59E0B;"></div>
                        <span>会議</span>
                    </div>
                </div>

                <!-- スケジュール表 -->
                <div class="schedule-container">
                    <div class="schedule-grid" id="scheduleGrid">
                        <!-- 動的に生成 -->
                    </div>
                </div>

                <!-- ローディング -->
                <div id="loading" class="loading" style="display: none;">
                    読み込み中...
                </div>
            </div>
        </main>
    </div>

    <!-- 予約追加/編集モーダル -->
    <div id="bookingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">予約追加</h3>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <input type="hidden" id="bookingId">
                    
                    <div class="form-group">
                        <label for="roomSelect">講義室 *</label>
                        <select id="roomSelect" required>
                            <option value="">講義室を選択してください</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="titleInput">タイトル *</label>
                        <input type="text" id="titleInput" required placeholder="例: データベース設計">
                    </div>

                    <div class="form-group">
                        <label for="instructorInput">担当者</label>
                        <input type="text" id="instructorInput" placeholder="例: 田中太郎">
                    </div>

                    <div class="form-group">
                        <label for="courseCodeInput">講義コード</label>
                        <input type="text" id="courseCodeInput" placeholder="例: CS101">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateInput">日付 *</label>
                            <input type="date" id="dateInput" required>
                        </div>
                        <div class="form-group">
                            <label for="startTimeInput">開始時間 *</label>
                            <select id="startTimeInput" required>
                                <option value="">選択してください</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="endTimeInput">終了時間 *</label>
                            <select id="endTimeInput" required>
                                <option value="">選択してください</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="colorInput">色</label>
                        <div class="color-options">
                            <label class="color-option">
                                <input type="radio" name="color" value="#3B82F6" checked>
                                <span class="color-preview" style="background: #3B82F6;"></span>
                                講義
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color" value="#EF4444">
                                <span class="color-preview" style="background: #EF4444;"></span>
                                試験
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color" value="#10B981">
                                <span class="color-preview" style="background: #10B981;"></span>
                                セミナー
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color" value="#F59E0B">
                                <span class="color-preview" style="background: #F59E0B;"></span>
                                会議
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descriptionInput">説明</label>
                        <textarea id="descriptionInput" placeholder="追加情報があれば入力してください"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn btn-secondary">キャンセル</button>
                        <button type="button" id="deleteBtn" class="btn btn-danger" style="display: none;">削除</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 確認ダイアログ -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>確認</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
                <div class="form-actions">
                    <button id="confirmCancel" class="btn btn-secondary">キャンセル</button>
                    <button id="confirmOk" class="btn btn-danger">OK</button>
                </div>
            </div>
        </div>
    </div>

    <?!= include('javascript'); ?>
</body>
</html>
