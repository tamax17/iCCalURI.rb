<script>
// グローバル変数
let currentMode = 'template'; // 'template' or 'booking'
let currentWeekStart = new Date();
let selectedDayOfWeek = ''; // テンプレートモードでの曜日フィルター
let rooms = [];
let templates = [];
let bookings = [];
let isLoading = false;

// 日本語の曜日配列
const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

// 初期化
document.addEventListener('DOMContentLoaded', function() {
    initializeApp();
});

async function initializeApp() {
    // 今週の月曜日を計算
    const today = new Date();
    const dayOfWeek = today.getDay();
    currentWeekStart = new Date(today);
    currentWeekStart.setDate(today.getDate() - dayOfWeek + 1);
    
    await loadRooms();
    
    setupEventListeners();
    setupTimeOptions();
    switchMode('template'); // 初期はテンプレートモード
}

// イベントリスナーの設定
function setupEventListeners() {
    // モード切り替え
    document.getElementById('templateModeBtn').addEventListener('click', () => switchMode('template'));
    document.getElementById('bookingModeBtn').addEventListener('click', () => switchMode('booking'));
    
    // 曜日フィルター
    document.getElementById('dayOfWeekSelect').addEventListener('change', (e) => {
        selectedDayOfWeek = e.target.value;
        if (currentMode === 'template') {
            renderTemplateSchedule();
        }
    });
    
    // 週移動ボタン（予約モード）
    document.getElementById('prevWeek').addEventListener('click', () => {
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        updateWeekDisplay();
        loadBookings();
    });
    
    document.getElementById('nextWeek').addEventListener('click', () => {
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        updateWeekDisplay();
        loadBookings();
    });
    
    // テンプレート追加ボタン
    document.getElementById('addTemplateBtn').addEventListener('click', () => {
        openTemplateModal();
    });
    
    // 予約展開ボタン
    document.getElementById('expandBookingsBtn').addEventListener('click', () => {
        openExpandModal();
    });
    
    // テンプレートモーダル関連
    document.getElementById('closeTemplateModal').addEventListener('click', closeTemplateModal);
    document.getElementById('cancelTemplateBtn').addEventListener('click', closeTemplateModal);
    document.getElementById('deleteTemplateBtn').addEventListener('click', deleteTemplate);
    document.getElementById('templateForm').addEventListener('submit', saveTemplate);
    
    // 予約展開モーダル関連
    document.getElementById('closeExpandModal').addEventListener('click', closeExpandModal);
    document.getElementById('cancelExpandBtn').addEventListener('click', closeExpandModal);
    document.getElementById('executeExpandBtn').addEventListener('click', executeExpand);
    
    // 確認ダイアログ
    document.getElementById('confirmCancel').addEventListener('click', closeConfirmModal);
    document.getElementById('confirmOk').addEventListener('click', confirmAction);
    
    // モーダル外クリックで閉じる
    document.getElementById('templateModal').addEventListener('click', (e) => {
        if (e.target.id === 'templateModal') closeTemplateModal();
    });
    
    document.getElementById('expandModal').addEventListener('click', (e) => {
        if (e.target.id === 'expandModal') closeExpandModal();
    });
    
    document.getElementById('confirmModal').addEventListener('click', (e) => {
        if (e.target.id === 'confirmModal') closeConfirmModal();
    });
}

// モード切り替え
async function switchMode(mode) {
    currentMode = mode;
    
    // タブの表示切り替え
    document.getElementById('templateModeBtn').classList.toggle('active', mode === 'template');
    document.getElementById('bookingModeBtn').classList.toggle('active', mode === 'booking');
    
    // コントロールの表示切り替え
    document.getElementById('templateControls').style.display = mode === 'template' ? 'flex' : 'none';
    document.getElementById('bookingControls').style.display = mode === 'booking' ? 'flex' : 'none';
    
    // ビューの表示切り替え
    document.getElementById('templateView').style.display = mode === 'template' ? 'block' : 'none';
    document.getElementById('bookingView').style.display = mode === 'booking' ? 'block' : 'none';
    
    // データ読み込み
    if (mode === 'template') {
        await loadTemplates();
        renderTemplateSchedule();
    } else {
        updateWeekDisplay();
        await loadBookings();
        renderBookingSchedule();
    }
}

// 講義室データの読み込み
async function loadRooms() {
    try {
        showLoading(true);
        rooms = await callGasFunction('getRooms');
        populateRoomSelect();
    } catch (error) {
        console.error('講義室の読み込みに失敗しました:', error);
        alert('講義室の読み込みに失敗しました');
    } finally {
        showLoading(false);
    }
}

// テンプレートデータの読み込み
async function loadTemplates() {
    try {
        showLoading(true);
        templates = await callGasFunction('getTemplates', selectedDayOfWeek);
    } catch (error) {
        console.error('テンプレートの読み込みに失敗しました:', error);
        alert('テンプレートの読み込みに失敗しました');
    } finally {
        showLoading(false);
    }
}

// 予約データの読み込み
async function loadBookings() {
    try {
        showLoading(true);
        const weekEnd = new Date(currentWeekStart);
        weekEnd.setDate(currentWeekStart.getDate() + 6);
        
        const startDate = formatDate(currentWeekStart);
        const endDate = formatDate(weekEnd);
        
        bookings = await callGasFunction('getBookings', startDate, endDate);
    } catch (error) {
        console.error('予約の読み込みに失敗しました:', error);
        alert('予約の読み込みに失敗しました');
    } finally {
        showLoading(false);
    }
}

// GAS関数の呼び出し
function callGasFunction(functionName, ...args) {
    return new Promise((resolve, reject) => {
        google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [functionName](...args);
    });
}

// 日付フォーマット
function formatDate(date) {
    return date.toISOString().split('T')[0];
}

// 週表示の更新
function updateWeekDisplay() {
    const weekEnd = new Date(currentWeekStart);
    weekEnd.setDate(currentWeekStart.getDate() + 6);
    
    const startStr = `${currentWeekStart.getMonth() + 1}/${currentWeekStart.getDate()}`;
    const endStr = `${weekEnd.getMonth() + 1}/${weekEnd.getDate()}`;
    
    document.getElementById('currentWeek').textContent = `${startStr} - ${endStr}`;
}

// テンプレートスケジュール表のレンダリング
function renderTemplateSchedule() {
    const grid = document.getElementById('templateGrid');
    grid.innerHTML = '';
    
    // ヘッダー行の作成
    createTemplateHeaders(grid);
    
    // 講義室行の作成
    rooms.forEach(room => {
        createTemplateRoomRow(grid, room);
    });
}

// テンプレートヘッダーの作成
function createTemplateHeaders(grid) {
    // 空のセル（左上角）
    const emptyCell = document.createElement('div');
    emptyCell.className = 'time-header';
    grid.appendChild(emptyCell);
    
    // 曜日ヘッダー
    const daysToShow = selectedDayOfWeek ? [selectedDayOfWeek] : ['月', '火', '水', '木', '金', '土', '日'];
    
    daysToShow.forEach(dayName => {
        const headerCell = document.createElement('div');
        headerCell.className = 'date-header';
        headerCell.textContent = `${dayName}曜日`;
        grid.appendChild(headerCell);
    });
}

// テンプレート講義室行の作成
function createTemplateRoomRow(grid, room) {
    // 講義室名のセル
    const roomHeader = document.createElement('div');
    roomHeader.className = 'room-header';
    roomHeader.textContent = room['講義室名'] || room.name;
    grid.appendChild(roomHeader);
    
    // 各曜日のセル
    const daysToShow = selectedDayOfWeek ? [selectedDayOfWeek] : ['月', '火', '水', '木', '金', '土', '日'];
    
    daysToShow.forEach(dayName => {
        const cell = document.createElement('div');
        cell.className = 'schedule-cell';
        cell.dataset.roomId = room.id || room.ID;
        cell.dataset.dayOfWeek = dayName;
        
        // この曜日のこの講義室のテンプレートを取得
        const dayTemplates = templates.filter(template => 
            (template.room_id || template['講義室id']) === (room.id || room.ID) && 
            (template.dayOfWeek || template['曜日']) === dayName
        );
        
        // テンプレートをセルに追加
        dayTemplates.forEach(template => {
            const templateElement = createTemplateElement(template);
            cell.appendChild(templateElement);
        });
        
        // セルクリックイベント
        cell.addEventListener('click', (e) => {
            if (!e.target.closest('.template-item')) {
                openTemplateModal(room.id || room.ID, dayName);
            }
        });
        
        grid.appendChild(cell);
    });
}

// テンプレート要素の作成
function createTemplateElement(template) {
    const element = document.createElement('div');
    element.className = 'template-item';
    element.style.backgroundColor = template.color || template['色'] || '#3B82F6';
    
    const title = document.createElement('div');
    title.className = 'template-title';
    title.textContent = template.title || template['タイトル'];
    
    const info = document.createElement('div');
    info.className = 'template-info';
    const startTime = template.start_time || template['開始時間'];
    const endTime = template.end_time || template['終了時間'];
    const instructor = template.instructor || template['担当者'];
    info.textContent = `${startTime}-${endTime} ${instructor || ''}`;
    
    element.appendChild(title);
    element.appendChild(info);
    
    // クリックで編集モーダルを開く
    element.addEventListener('click', (e) => {
        e.stopPropagation();
        editTemplate(template);
    });
    
    return element;
}

// 予約スケジュール表のレンダリング
function renderBookingSchedule() {
    const grid = document.getElementById('scheduleGrid');
    grid.innerHTML = '';
    
    // ヘッダー行の作成
    createBookingHeaders(grid);
    
    // 講義室行の作成
    rooms.forEach(room => {
        createBookingRoomRow(grid, room);
    });
}

// 予約ヘッダーの作成
function createBookingHeaders(grid) {
    // 空のセル（左上角）
    const emptyCell = document.createElement('div');
    emptyCell.className = 'time-header';
    grid.appendChild(emptyCell);
    
    // 日付ヘッダー
    for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(currentWeekStart.getDate() + i);
        
        const headerCell = document.createElement('div');
        headerCell.className = 'date-header';
        
        const dateNumber = document.createElement('div');
        dateNumber.className = 'date-number';
        dateNumber.textContent = date.getDate();
        
        const dateDay = document.createElement('div');
        dateDay.className = 'date-day';
        dateDay.textContent = dayNames[date.getDay()];
        
        headerCell.appendChild(dateNumber);
        headerCell.appendChild(dateDay);
        grid.appendChild(headerCell);
    }
}

// 予約講義室行の作成
function createBookingRoomRow(grid, room) {
    // 講義室名のセル
    const roomHeader = document.createElement('div');
    roomHeader.className = 'room-header';
    roomHeader.textContent = room['講義室名'] || room.name;
    grid.appendChild(roomHeader);
    
    // 各日のセル
    for (let i = 0; i < 7; i++) {
        const date = new Date(currentWeekStart);
        date.setDate(currentWeekStart.getDate() + i);
        const dateStr = formatDate(date);
        
        const cell = document.createElement('div');
        cell.className = 'schedule-cell';
        cell.dataset.roomId = room.id || room.ID;
        cell.dataset.date = dateStr;
        
        // この日のこの講義室の予約を取得
        const dayBookings = bookings.filter(booking => 
            (booking.room_id || booking['講義室id']) === (room.id || room.ID) && 
            (booking.date || booking['日付']) === dateStr
        );
        
        // 予約をセルに追加
        dayBookings.forEach(booking => {
            const bookingElement = createBookingElement(booking);
            cell.appendChild(bookingElement);
        });
        
        grid.appendChild(cell);
    }
}

// 予約要素の作成
function createBookingElement(booking) {
    const element = document.createElement('div');
    element.className = 'booking';
    element.style.backgroundColor = booking.color || booking['色'] || '#3B82F6';
    
    const title = document.createElement('div');
    title.className = 'booking-title';
    title.textContent = booking.title || booking['タイトル'];
    
    const info = document.createElement('div');
    info.className = 'booking-info';
    const startTime = booking.start_time || booking['開始時間'];
    const endTime = booking.end_time || booking['終了時間'];
    const instructor = booking.instructor || booking['担当者'];
    info.textContent = `${startTime}-${endTime} ${instructor || ''}`;
    
    element.appendChild(title);
    element.appendChild(info);
    
    return element;
}

// 講義室セレクトの設定
function populateRoomSelect() {
    const select = document.getElementById('templateRoomSelect');
    select.innerHTML = '<option value="">講義室を選択してください</option>';
    
    rooms.forEach(room => {
        const option = document.createElement('option');
        option.value = room.id || room.ID;
        option.textContent = `${room['講義室名'] || room.name} (${room['収容人数'] || room.capacity}人)`;
        select.appendChild(option);
    });
}

// 時間オプションの設定
function setupTimeOptions() {
    const startSelect = document.getElementById('templateStartTimeInput');
    const endSelect = document.getElementById('templateEndTimeInput');
    
    // 時間オプションを生成
    const timeSlots = [];
    for (let hour = 9; hour < 18; hour++) {
        timeSlots.push(`${hour.toString().padStart(2, '0')}:00`);
        if (hour < 17) {
            timeSlots.push(`${hour.toString().padStart(2, '0')}:30`);
        }
    }
    
    // 開始時間
    startSelect.innerHTML = '<option value="">選択してください</option>';
    timeSlots.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        startSelect.appendChild(option);
    });
    
    // 終了時間
    endSelect.innerHTML = '<option value="">選択してください</option>';
    timeSlots.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        endSelect.appendChild(option);
    });
    
    // 開始時間変更時に終了時間を自動設定
    startSelect.addEventListener('change', () => {
        const startTime = startSelect.value;
        if (startTime) {
            const startHour = parseInt(startTime.split(':')[0]);
            const startMinute = parseInt(startTime.split(':')[1]);
            const endHour = startMinute === 30 ? startHour + 1 : startHour;
            const endMinute = startMinute === 30 ? 30 : 30;
            const suggestedEndTime = `${endHour.toString().padStart(2, '0')}:${endMinute.toString().padStart(2, '0')}`;
            
            if (timeSlots.includes(suggestedEndTime)) {
                endSelect.value = suggestedEndTime;
            }
        }
    });
}

// テンプレートモーダルを開く
function openTemplateModal(roomId = '', dayOfWeek = '') {
    document.getElementById('templateModal').style.display = 'flex';
    document.getElementById('templateModalTitle').textContent = 'テンプレート追加';
    document.getElementById('templateForm').reset();
    document.getElementById('templateId').value = '';
    document.getElementById('deleteTemplateBtn').style.display = 'none';
    
    if (roomId) {
        document.getElementById('templateRoomSelect').value = roomId;
    }
    
    if (dayOfWeek) {
        document.getElementById('templateDaySelect').value = dayOfWeek;
    }
}

// テンプレート編集モーダルを開く
function editTemplate(template) {
    document.getElementById('templateModal').style.display = 'flex';
    document.getElementById('templateModalTitle').textContent = 'テンプレート編集';
    document.getElementById('deleteTemplateBtn').style.display = 'block';
    
    // フォームに値を設定
    document.getElementById('templateId').value = template.id || template.ID;
    document.getElementById('templateDaySelect').value = template.dayOfWeek || template['曜日'];
    document.getElementById('templateRoomSelect').value = template.room_id || template['講義室id'];
    document.getElementById('templateTitleInput').value = template.title || template['タイトル'];
    document.getElementById('templateInstructorInput').value = template.instructor || template['担当者'] || '';
    document.getElementById('templateCourseCodeInput').value = template.course_code || template['講義コード'] || '';
    document.getElementById('templateStartTimeInput').value = template.start_time || template['開始時間'];
    document.getElementById('templateEndTimeInput').value = template.end_time || template['終了時間'];
    document.getElementById('templateDescriptionInput').value = template.description || template['説明'] || '';
    
    // 色の設定
    const color = template.color || template['色'] || '#3B82F6';
    const colorRadio = document.querySelector(`input[name="templateColor"][value="${color}"]`);
    if (colorRadio) {
        colorRadio.checked = true;
    }
}

// テンプレートモーダルを閉じる
function closeTemplateModal() {
    document.getElementById('templateModal').style.display = 'none';
}

// テンプレート保存
async function saveTemplate(e) {
    e.preventDefault();
    
    const templateData = {
        roomId: document.getElementById('templateRoomSelect').value,
        dayOfWeek: document.getElementById('templateDaySelect').value,
        title: document.getElementById('templateTitleInput').value,
        instructor: document.getElementById('templateInstructorInput').value,
        courseCode: document.getElementById('templateCourseCodeInput').value,
        startTime: document.getElementById('templateStartTimeInput').value,
        endTime: document.getElementById('templateEndTimeInput').value,
        color: document.querySelector('input[name="templateColor"]:checked')?.value || '#3B82F6',
        description: document.getElementById('templateDescriptionInput').value
    };
    
    // バリデーション
    if (!templateData.roomId || !templateData.dayOfWeek || !templateData.title || 
        !templateData.startTime || !templateData.endTime) {
        alert('必須項目を入力してください');
        return;
    }
    
    if (templateData.startTime >= templateData.endTime) {
        alert('終了時間は開始時間より後に設定してください');
        return;
    }
    
    try {
        showLoading(true);
        
        const templateId = document.getElementById('templateId').value;
        
        if (templateId) {
            // 更新
            await callGasFunction('updateTemplate', templateId, templateData);
        } else {
            // 新規作成
            await callGasFunction('createTemplate', templateData);
        }
        
        closeTemplateModal();
        await loadTemplates();
        renderTemplateSchedule();
        
    } catch (error) {
        console.error('テンプレートの保存に失敗しました:', error);
        alert('テンプレートの保存に失敗しました: ' + error.message);
    } finally {
        showLoading(false);
    }
}

// テンプレート削除
function deleteTemplate() {
    const templateId = document.getElementById('templateId').value;
    if (!templateId) return;
    
    showConfirmModal('このテンプレートを削除しますか？', async () => {
        try {
            showLoading(true);
            await callGasFunction('deleteTemplate', templateId);
            closeTemplateModal();
            await loadTemplates();
            renderTemplateSchedule();
        } catch (error) {
            console.error('テンプレートの削除に失敗しました:', error);
            alert('テンプレートの削除に失敗しました: ' + error.message);
        } finally {
            showLoading(false);
        }
    });
}

// 予約展開モーダルを開く
function openExpandModal() {
    document.getElementById('expandModal').style.display = 'flex';
    
    // デフォルト期間を設定（今日から3ヶ月後まで）
    const today = new Date();
    const threeMonthsLater = new Date();
    threeMonthsLater.setMonth(today.getMonth() + 3);
    
    document.getElementById('expandStartDate').value = formatDate(today);
    document.getElementById('expandEndDate').value = formatDate(threeMonthsLater);
}

// 予約展開モーダルを閉じる
function closeExpandModal() {
    document.getElementById('expandModal').style.display = 'none';
}

// 予約展開実行
async function executeExpand() {
    const startDate = document.getElementById('expandStartDate').value;
    const endDate = document.getElementById('expandEndDate').value;
    
    if (!startDate || !endDate) {
        alert('期間を指定してください');
        return;
    }
    
    if (startDate >= endDate) {
        alert('終了日は開始日より後に設定してください');
        return;
    }
    
    showConfirmModal('テンプレートから予約を展開しますか？既存の予約は削除されます。', async () => {
        try {
            showLoading(true);
            const result = await callGasFunction('expandTemplateToBookings', startDate, endDate);
            closeExpandModal();
            alert(result.message);
            
            // 予約モードに切り替えて結果を表示
            await switchMode('booking');
        } catch (error) {
            console.error('予約展開に失敗しました:', error);
            alert('予約展開に失敗しました: ' + error.message);
        } finally {
            showLoading(false);
        }
    });
}

// 確認ダイアログを表示
function showConfirmModal(message, callback) {
    document.getElementById('confirmMessage').textContent = message;
    document.getElementById('confirmModal').style.display = 'flex';
    
    // コールバック関数を保存
    window.confirmCallback = callback;
}

// 確認ダイアログを閉じる
function closeConfirmModal() {
    document.getElementById('confirmModal').style.display = 'none';
    window.confirmCallback = null;
}

// 確認アクション
function confirmAction() {
    if (window.confirmCallback) {
        window.confirmCallback();
    }
    closeConfirmModal();
}

// ローディング表示/非表示
function showLoading(show) {
    isLoading = show;
    document.getElementById('loading').style.display = show ? 'block' : 'none';
    
    // ボタンの無効化/有効化
    const buttons = document.querySelectorAll('button');
    buttons.forEach(btn => {
        btn.disabled = show;
    });
}

// エラーハンドリング
window.addEventListener('error', (event) => {
    console.error('エラーが発生しました:', event.error);
});

// Google Apps Script の読み込み完了を待つ
window.addEventListener('load', () => {
    if (typeof google === 'undefined' || !google.script) {
        console.error('Google Apps Script APIが読み込まれていません');
        alert('アプリケーションの初期化に失敗しました');
    }
});
</script>
