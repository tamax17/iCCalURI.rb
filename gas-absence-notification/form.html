<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業欠席連絡フォーム</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px 0;
    }
    .form-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 2rem;
      margin: 20px auto;
      max-width: 800px;
    }
    .header-section {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e9ecef;
    }
    .form-section {
      margin-bottom: 2rem;
    }
    .section-title {
      color: #495057;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 1rem;
    }
    .form-check {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 10px;
      transition: all 0.3s ease;
    }
    .form-check:hover {
      background: #e9ecef;
      border-color: #6c757d;
    }
    .form-check-input:checked + .form-check-label {
      font-weight: 600;
      color: #0d6efd;
    }
    .btn-submit {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border: none;
      padding: 12px 40px;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .loading {
      display: none;
    }
    .result-message {
      display: none;
      margin-top: 1rem;
    }
    .required {
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <!-- ヘッダー部分 -->
      <div class="header-section">
        <h1 class="h2 text-primary mb-3">
          <i class="bi bi-envelope-paper"></i>
          授業欠席連絡フォーム
        </h1>
        <p class="text-muted">
          複数の授業を欠席する場合、このフォームから各担当教員に一括で連絡を送信できます。
        </p>
      </div>

      <!-- 欠席連絡フォーム -->
      <form id="absenceForm">
        <!-- 学生情報セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-person-circle text-primary"></i>
            学生情報
          </h3>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="studentId" class="form-label">
                学生番号 <span class="required">*</span>
              </label>
              <input type="text" class="form-control" id="studentId" name="studentId" required 
                     placeholder="例: B2024001" maxlength="12" 
                     autocomplete="off" style="text-transform: uppercase;">
              <div class="form-text">最初はアルファベット、その後に英数字を入力してください</div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="studentName" class="form-label">
                氏名 <span class="required">*</span>
              </label>
              <input type="text" class="form-control" id="studentName" name="studentName" required 
                     placeholder="例: 山田太郎" maxlength="50">
            </div>
          </div>
          <div class="row">
            <div class="col-12 mb-3">
              <label for="studentEmail" class="form-label">
                メールアドレス <span class="required">*</span>
              </label>
              <input type="email" class="form-control" id="studentEmail" name="studentEmail" required 
                     placeholder="例: yamada@hiroshima-u.ac.jp" maxlength="100">
              <div class="form-text">教員からの返信や確認連絡に使用されます。</div>
            </div>
          </div>
        </div>

        <!-- 欠席期間セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-calendar-range text-warning"></i>
            欠席期間
          </h3>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="startDate" class="form-label">
                欠席開始日 <span class="required">*</span>
              </label>
              <input type="date" class="form-control" id="startDate" name="startDate" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="endDate" class="form-label">
                欠席終了日 <span class="required">*</span>
              </label>
              <input type="date" class="form-control" id="endDate" name="endDate" required>
            </div>
          </div>
        </div>

        <!-- 欠席理由セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-chat-left-text text-info"></i>
            欠席理由
          </h3>
          <textarea class="form-control" id="reason" name="reason" rows="3" 
                    placeholder="欠席理由を入力してください（任意）" maxlength="500"></textarea>
          <div class="form-text">任意入力です。病気、家庭の事情など、簡潔に記入してください。</div>
        </div>

        <!-- 欠席科目選択セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-book text-success"></i>
            欠席する科目 <span class="required">*</span>
          </h3>
          <p class="text-muted mb-3">欠席する授業科目をすべて選択してください。</p>
          
          <!-- 全選択/全解除ボタン -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-primary btn-sm me-2" onclick="selectAllSubjects()">
              <i class="bi bi-check-all"></i> 全選択
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearAllSubjects()">
              <i class="bi bi-x-square"></i> 全解除
            </button>
          </div>

          <!-- 科目チェックボックス（動的に生成） -->
          <div id="subjectsContainer" class="checkbox-grid">
            <div class="text-center p-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">読み込み中...</span>
              </div>
              <p class="mt-2 text-muted">授業情報を読み込んでいます...</p>
            </div>
          </div>
        </div>

        <!-- 送信ボタン -->
        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-submit">
            <span class="submit-text">
              <i class="bi bi-check-circle"></i>
              入力内容を確認
            </span>
            <span class="loading">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              送信中...
            </span>
          </button>
        </div>

        <!-- 結果表示エリア -->
        <div id="resultMessage" class="result-message"></div>
      </form>
    </div>

    <!-- 確認画面モーダル -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmModalLabel">
              <i class="bi bi-check-circle text-primary"></i>
              送信内容の確認
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-info">
              <i class="bi bi-info-circle"></i>
              以下の内容で欠席連絡を送信します。内容に間違いがないかご確認ください。
            </div>
            
            <!-- 確認内容表示エリア -->
            <div id="confirmContent"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              <i class="bi bi-arrow-left"></i>
              修正する
            </button>
            <button type="button" class="btn btn-primary" id="finalSubmitBtn">
              <i class="bi bi-send"></i>
              送信する
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // グローバル変数
    let courses = [];
    let isSubmitting = false;

    // ページ読み込み時の処理
    document.addEventListener('DOMContentLoaded', function() {
      loadCourses();
      initializeDateInputs();
      setupFormValidation();
      setupStudentIdInput();
      setupConfirmModal();
    });

    // 確認モーダルの設定
    function setupConfirmModal() {
      document.getElementById('finalSubmitBtn').addEventListener('click', function() {
        performActualSubmit();
      });
    }

    // 授業情報を読み込む
    function loadCourses() {
      google.script.run
        .withSuccessHandler(onCoursesLoaded)
        .withFailureHandler(onCoursesLoadError)
        .getCourses();
    }

    // 授業情報読み込み成功時の処理
    function onCoursesLoaded(courseData) {
      courses = courseData;
      renderSubjectsCheckboxes();
    }

    // 授業情報読み込み失敗時の処理
    function onCoursesLoadError(error) {
      console.error('授業情報の読み込みに失敗しました:', error);
      document.getElementById('subjectsContainer').innerHTML = `
        <div class="text-center p-4 text-danger">
          <i class="bi bi-exclamation-triangle"></i>
          <p class="mt-2">授業情報の読み込みに失敗しました。<br>ページを再読み込みしてください。</p>
        </div>
      `;
    }

    // 科目チェックボックスを生成
    function renderSubjectsCheckboxes() {
      const container = document.getElementById('subjectsContainer');
      
      if (courses.length === 0) {
        container.innerHTML = `
          <div class="text-center p-4 text-warning">
            <i class="bi bi-info-circle"></i>
            <p class="mt-2">授業情報が登録されていません。<br>管理者にお問い合わせください。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = courses.map((course, index) => `
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="subject_${index}" 
                 name="subjects" value="${course.courseName}">
          <label class="form-check-label" for="subject_${index}">
            <strong>${course.courseName}</strong><br>
            <small class="text-muted">${course.teacherName}先生</small>
          </label>
        </div>
      `).join('');
    }

    // 日付入力の初期化
    function initializeDateInputs() {
      // 開始日は1週間前から制限なし（過去の欠席と予定された欠席の両方に対応）
      const today = new Date();
      const oneWeekAgo = new Date(today);
      oneWeekAgo.setDate(today.getDate() - 7);
      
      const oneWeekAgoStr = oneWeekAgo.toISOString().split('T')[0];
      
      // 開始日の制限を設定（1週間前以降なら制限なし）
      const startDateInput = document.getElementById('startDate');
      startDateInput.setAttribute('min', oneWeekAgoStr);
      // 最大値制限は削除（未来の欠席予定も入力可能）
      
      // 開始日が変更されたら終了日の最小値を更新
      startDateInput.addEventListener('change', function() {
        const endDateInput = document.getElementById('endDate');
        endDateInput.setAttribute('min', this.value);
        
        // もし終了日が開始日より前になっている場合はクリア
        if (endDateInput.value && endDateInput.value < this.value) {
          endDateInput.value = '';
        }
      });
    }

    // フォームバリデーションの設定
    function setupFormValidation() {
      document.getElementById('absenceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (isSubmitting) {
          return;
        }
        
        if (this.checkValidity()) {
          submitForm();
        } else {
          this.reportValidity();
          showMessage('error', '必須項目をすべて入力してください。');
        }
      });
    }

    // フォーム送信処理（確認画面表示）
    function submitForm() {
      // バリデーション
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const studentEmail = document.getElementById('studentEmail').value.trim();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const selectedSubjects = document.querySelectorAll('input[name="subjects"]:checked');

      if (!studentId || !studentName || !studentEmail || !startDate || !endDate) {
        showMessage('error', '必須項目を入力してください。');
        return;
      }

      // 学生番号の形式チェック（最初はアルファベット、その後は英数字）
      if (!/^[A-Za-z][0-9A-Za-z]*$/.test(studentId)) {
        showMessage('error', '学生番号は最初にアルファベット、その後に英数字を入力してください（例: B2024001）。');
        return;
      }

      // メールアドレスの形式チェック
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(studentEmail)) {
        showMessage('error', '正しいメールアドレスを入力してください。');
        return;
      }

      if (selectedSubjects.length === 0) {
        showMessage('error', '欠席する科目を少なくとも1つ選択してください。');
        return;
      }

      if (new Date(startDate) > new Date(endDate)) {
        showMessage('error', '終了日は開始日以降の日付を選択してください。');
        return;
      }

      // 確認画面を表示
      showConfirmModal();
    }

    // 確認画面表示
    function showConfirmModal() {
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const studentEmail = document.getElementById('studentEmail').value.trim();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const reason = document.getElementById('reason').value.trim();
      const selectedSubjects = Array.from(document.querySelectorAll('input[name="subjects"]:checked'));

      // 日付のフォーマット
      const formatDate = (dateStr) => {
        const date = new Date(dateStr);
        return date.toLocaleDateString('ja-JP', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric',
          weekday: 'short'
        });
      };

      // 確認画面の内容を生成
      let confirmContent = `
        <div class="row">
          <div class="col-md-6">
            <h6 class="text-primary"><i class="bi bi-person-circle"></i> 学生情報</h6>
            <div class="card mb-3">
              <div class="card-body">
                <p><strong>学生番号:</strong> ${studentId}</p>
                <p><strong>氏名:</strong> ${studentName}</p>
                <p><strong>メールアドレス:</strong> ${studentEmail}</p>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <h6 class="text-warning"><i class="bi bi-calendar-range"></i> 欠席期間</h6>
            <div class="card mb-3">
              <div class="card-body">
                <p><strong>開始日:</strong> ${formatDate(startDate)}</p>
                <p><strong>終了日:</strong> ${formatDate(endDate)}</p>
                <p><strong>期間:</strong> ${new Date(startDate).getTime() === new Date(endDate).getTime() ? '1日間' : Math.ceil((new Date(endDate) - new Date(startDate)) / (1000 * 60 * 60 * 24)) + 1 + '日間'}</p>
              </div>
            </div>
          </div>
        </div>
        
        <div class="row">
          <div class="col-12">
            <h6 class="text-success"><i class="bi bi-book"></i> 欠席科目</h6>
            <div class="card mb-3">
              <div class="card-body">
                ${generateTeacherGroupDisplay(selectedSubjects)}
              </div>
            </div>
          </div>
        </div>

        ${reason ? `
        <div class="row">
          <div class="col-12">
            <h6 class="text-info"><i class="bi bi-chat-left-text"></i> 欠席理由</h6>
            <div class="card">
              <div class="card-body">
                <p class="mb-0">${reason}</p>
              </div>
            </div>
          </div>
        </div>
        ` : ''}
      `;

      document.getElementById('confirmContent').innerHTML = confirmContent;
      
      // モーダルを表示
      const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
      confirmModal.show();
    }

    // 教員ごとの科目グループ表示を生成
    function generateTeacherGroupDisplay(selectedSubjects) {
      // 教員ごとに科目をグループ化
      const teacherGroups = {};
      
      selectedSubjects.forEach(cb => {
        const course = courses.find(c => c.courseName === cb.value);
        if (course) {
          const teacherKey = course.teacherName; // 教員名をキーとして使用
          if (!teacherGroups[teacherKey]) {
            teacherGroups[teacherKey] = {
              teacherName: course.teacherName,
              email: course.email,
              subjects: []
            };
          }
          teacherGroups[teacherKey].subjects.push(cb.value);
        }
      });

      // グループ化された表示を生成
      let display = '';
      let groupCount = 0;
      
      for (const teacherKey in teacherGroups) {
        const group = teacherGroups[teacherKey];
        groupCount++;
        
        // 教員情報のヘッダー
        const isMultipleSubjects = group.subjects.length > 1;
        const emailIcon = isMultipleSubjects ? 
          '<i class="bi bi-envelope-fill text-primary"></i>' : 
          '<i class="bi bi-envelope text-primary"></i>';
        
        display += `
          <div class="teacher-group mb-3 ${groupCount > 1 ? 'border-top pt-3' : ''}">
            <div class="d-flex align-items-center mb-2">
              ${emailIcon}
              <strong class="ms-2">${group.teacherName}先生</strong>
              ${isMultipleSubjects ? 
                '<span class="badge bg-primary ms-2">統合メール</span>' : 
                '<span class="badge bg-outline-secondary ms-2">個別メール</span>'
              }
            </div>
            <ul class="list-unstyled mb-0 ms-4">
        `;
        
        // 科目一覧
        group.subjects.forEach(subject => {
          display += `
            <li class="mb-1">
              <i class="bi bi-check-circle-fill text-success"></i> 
              <strong>${subject}</strong>
            </li>
          `;
        });
        
        display += `
            </ul>
            <small class="text-muted ms-4">
              ${isMultipleSubjects ? 
                `${group.subjects.length}科目まとめて1通のメールで送信` : 
                '1科目1通のメールで送信'
              }
            </small>
          </div>
        `;
      }

      return display;
    }

    // 実際の送信処理
    function performActualSubmit() {
      const formData = {
        studentId: document.getElementById('studentId').value.trim(),
        studentName: document.getElementById('studentName').value.trim(),
        studentEmail: document.getElementById('studentEmail').value.trim(),
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        reason: document.getElementById('reason').value.trim(),
        subjects: Array.from(document.querySelectorAll('input[name="subjects"]:checked')).map(cb => cb.value)
      };

      isSubmitting = true;
      
      // モーダルを閉じる
      const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmModal'));
      confirmModal.hide();
      
      // ローディング表示
      showLoading(true);

      // Google Apps Scriptに送信
      google.script.run
        .withSuccessHandler(onSubmitSuccess)
        .withFailureHandler(onSubmitError)
        .submitAbsence(formData);
    }



    // 送信成功時の処理
    function onSubmitSuccess(result) {
      isSubmitting = false;
      showLoading(false);

      if (result.success) {
        let message = `
          <div class="alert alert-success">
            <h5><i class="bi bi-check-circle"></i> 欠席連絡を送信しました</h5>
        `;

        if (result.emailsSent && result.emailsSent.length > 0) {
          message += `
            <p><strong>メール送信完了:</strong></p>
            <ul>
              ${result.emailsSent.map(subject => `<li>${subject}</li>`).join('')}
            </ul>
          `;
        }

        if (result.emailsNotSent && result.emailsNotSent.length > 0) {
          message += `
            <p class="text-warning"><strong>送信できませんでした:</strong></p>
            <ul>
              ${result.emailsNotSent.map(subject => `<li>${subject}</li>`).join('')}
            </ul>
          `;
        }

        message += '</div>';
        showMessage('success', message);

        // フォームをリセット
        setTimeout(() => {
          document.getElementById('absenceForm').reset();
          clearAllSubjects();
        }, 2000);

      } else {
        showMessage('error', result.error || '送信に失敗しました。');
      }
    }

    // 送信失敗時の処理
    function onSubmitError(error) {
      isSubmitting = false;
      showLoading(false);
      console.error('送信エラー:', error);
      showMessage('error', 'システムエラーが発生しました。時間をおいて再度お試しください。');
    }

    // ローディング表示の切り替え
    function showLoading(show) {
      var submitText = document.querySelector('.submit-text');
      var loading = document.querySelector('.loading');
      var submitButton = document.querySelector('.btn-submit');

      if (show) {
        if (submitText) submitText.style.display = 'none';
        if (loading) loading.style.display = 'inline';
        if (submitButton) submitButton.disabled = true;
      } else {
        if (submitText) submitText.style.display = 'inline';
        if (loading) loading.style.display = 'none';
        if (submitButton) submitButton.disabled = false;
      }
    }

    // メッセージ表示
    function showMessage(type, message) {
      const resultDiv = document.getElementById('resultMessage');
      
      resultDiv.innerHTML = message;
      resultDiv.className = `result-message alert ${type === 'error' ? 'alert-danger' : 'alert-success'}`;
      resultDiv.style.display = 'block';

      // 5秒後に自動で隠す（成功時のみ）
      if (type === 'success') {
        setTimeout(() => {
          resultDiv.style.display = 'none';
        }, 5000);
      }

      // メッセージの位置までスクロール
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // 全科目選択
    function selectAllSubjects() {
      document.querySelectorAll('input[name="subjects"]').forEach(cb => cb.checked = true);
    }

    // 全科目選択解除
    function clearAllSubjects() {
      document.querySelectorAll('input[name="subjects"]').forEach(cb => cb.checked = false);
    }

    // 学生番号入力の設定
    function setupStudentIdInput() {
      const studentIdInput = document.getElementById('studentId');
      
      // 入力時に自動で大文字に変換
      studentIdInput.addEventListener('input', function(e) {
        let value = e.target.value.toUpperCase();
        
        // 英数字のみ許可
        value = value.replace(/[^A-Z0-9]/g, '');
        
        // 最初は必ずアルファベット
        if (value.length > 0 && !/^[A-Z]/.test(value)) {
          value = value.replace(/^[^A-Z]*/, '');
        }
        
        e.target.value = value;
      });
      
      // ペースト時の処理
      studentIdInput.addEventListener('paste', function(e) {
        setTimeout(() => {
          e.target.dispatchEvent(new Event('input', { bubbles: true }));
        }, 0);
      });
    }


  </script>
</body>
</html>
