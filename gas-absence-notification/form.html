<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>授業欠席連絡フォーム</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 10px 0;
      font-size: 16px; /* iOS での zoom を防ぐため16px以上 */
      line-height: 1.5;
    }
    
    .form-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 1.5rem;
      margin: 10px auto;
      max-width: 800px;
      width: calc(100% - 20px);
    }
    
    .header-section {
      text-align: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e9ecef;
    }
    
    .header-section h1 {
      font-size: 1.5rem;
      margin-bottom: 0.8rem;
    }
    
    .header-section p {
      font-size: 0.9rem;
    }
    
    .form-section {
      margin-bottom: 1.5rem;
    }
    
    .section-title {
      color: #495057;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
    }
    
    .section-title i {
      font-size: 1.2rem;
    }
    
    /* フォーム要素の調整 */
    .form-control, .form-select {
      font-size: 16px; /* iOS での zoom を防ぐ */
      padding: 0.75rem;
      border-radius: 8px;
      border: 2px solid #e9ecef;
      transition: border-color 0.3s ease;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .form-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }
    
    .form-text {
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }
    
    /* チェックボックスグリッドの調整 */
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 1rem;
    }
    
    .form-check {
      background: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 12px;
      padding: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
    }
    
    .form-check:active {
      transform: scale(0.98);
    }
    
    .form-check:hover, .form-check:focus-within {
      background: #e9ecef;
      border-color: #6c757d;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .form-check-input {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      margin-top: 0;
      flex-shrink: 0;
    }
    
    .form-check-input:checked + .form-check-label {
      font-weight: 600;
      color: #0d6efd;
    }
    
    .form-check-label {
      margin-bottom: 0;
      cursor: pointer;
      flex: 1;
      font-size: 1rem;
      line-height: 1.4;
    }
    
    /* ボタンの調整 */
    .btn {
      font-size: 16px;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 600;
      min-height: 48px; /* タッチターゲットサイズ */
    }
    
    .btn-sm {
      padding: 8px 16px;
      font-size: 14px;
      min-height: 40px;
    }
    
    .btn-submit {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border: none;
      padding: 16px 40px;
      width: 100%;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn-submit:active {
      transform: translateY(0);
    }
    
    .loading {
      display: none;
    }
    
    .result-message {
      display: none;
      margin-top: 1rem;
    }
    
    .required {
      color: #dc3545;
    }
    
    /* スマホ向けの追加調整 */
    @media (min-width: 576px) {
      .checkbox-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }
    
    @media (min-width: 768px) {
      body {
        padding: 20px 0;
      }
      
      .form-container {
        padding: 2rem;
        margin: 20px auto;
      }
      
      .form-section {
        margin-bottom: 2rem;
      }
      
      .header-section {
        margin-bottom: 2rem;
      }
      
      .header-section h1 {
        font-size: 2rem;
      }
      
      .btn-submit {
        width: auto;
        padding: 12px 40px;
      }
    }
    
    /* タッチデバイス向けの調整 */
    @media (hover: none) and (pointer: coarse) {
      .form-check:hover {
        background: #f8f9fa;
        border-color: #dee2e6;
        box-shadow: none;
      }
      
      .btn-submit:hover {
        transform: none;
        box-shadow: none;
      }
    }
    
    /* 縦向きスマホでの調整 */
    @media (max-width: 576px) and (orientation: portrait) {
      .container {
        padding-left: 10px;
        padding-right: 10px;
      }
      
      .section-title {
        font-size: 1rem;
        flex-wrap: wrap;
      }
    }
    
    /* 横向きスマホでの調整 */
    @media (max-width: 767px) and (orientation: landscape) {
      body {
        padding: 5px 0;
      }
      
      .form-container {
        margin: 5px auto;
        padding: 1rem;
      }
      
      .header-section {
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
      }
      
      .form-section {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-container">
      <!-- ヘッダー部分 -->
      <div class="header-section">
        <h1 class="h2 text-primary mb-3">
          <i class="bi bi-envelope-paper"></i>
          授業欠席連絡フォーム
        </h1>
        <p class="text-muted">
          複数の授業を欠席する場合、このフォームから各担当教員に一括で連絡を送信できます。
        </p>
      </div>

      <!-- 欠席連絡フォーム -->
      <form id="absenceForm">
        <!-- 学生情報セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-person-circle text-primary"></i>
            学生情報
          </h3>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="studentId" class="form-label">
                学生番号 <span class="required">*</span>
              </label>
              <input type="text" class="form-control" id="studentId" name="studentId" required 
                     placeholder="例: 2024001" maxlength="10" 
                     inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>
            <div class="col-sm-6 mb-3">
              <label for="studentName" class="form-label">
                氏名 <span class="required">*</span>
              </label>
              <input type="text" class="form-control" id="studentName" name="studentName" required 
                     placeholder="例: 山田太郎" maxlength="50" 
                     autocomplete="name" autocapitalize="words">
            </div>
          </div>
          <div class="row">
            <div class="col-12 mb-3">
              <label for="studentEmail" class="form-label">
                メールアドレス <span class="required">*</span>
              </label>
              <input type="email" class="form-control" id="studentEmail" name="studentEmail" required 
                     placeholder="例: yamada@hiroshima-u.ac.jp" maxlength="100"
                     inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false">
              <div class="form-text">教員からの返信や確認連絡に使用されます。</div>
            </div>
          </div>
        </div>

        <!-- 欠席期間セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-calendar-range text-warning"></i>
            欠席期間
          </h3>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="startDate" class="form-label">
                欠席開始日 <span class="required">*</span>
              </label>
              <input type="date" class="form-control" id="startDate" name="startDate" required 
                     autocomplete="off">
            </div>
            <div class="col-sm-6 mb-3">
              <label for="endDate" class="form-label">
                欠席終了日 <span class="required">*</span>
              </label>
              <input type="date" class="form-control" id="endDate" name="endDate" required 
                     autocomplete="off">
            </div>
          </div>
        </div>

        <!-- 欠席理由セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-chat-left-text text-info"></i>
            欠席理由
          </h3>
          <textarea class="form-control" id="reason" name="reason" rows="3" 
                    placeholder="欠席理由を入力してください（任意）" maxlength="500"
                    autocomplete="off" autocapitalize="sentences" spellcheck="true"></textarea>
          <div class="form-text">任意入力です。病気、家庭の事情など、簡潔に記入してください。</div>
        </div>

        <!-- 欠席科目選択セクション -->
        <div class="form-section">
          <h3 class="section-title">
            <i class="bi bi-book text-success"></i>
            欠席する科目 <span class="required">*</span>
          </h3>
          <p class="text-muted mb-3">欠席する授業科目をすべて選択してください。</p>
          
          <!-- 全選択/全解除ボタン -->
          <div class="mb-3">
            <button type="button" class="btn btn-outline-primary btn-sm me-2" onclick="selectAllSubjects()">
              <i class="bi bi-check-all"></i> 全選択
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearAllSubjects()">
              <i class="bi bi-x-square"></i> 全解除
            </button>
          </div>

          <!-- 科目チェックボックス（動的に生成） -->
          <div id="subjectsContainer" class="checkbox-grid">
            <div class="text-center p-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">読み込み中...</span>
              </div>
              <p class="mt-2 text-muted">授業情報を読み込んでいます...</p>
            </div>
          </div>
        </div>

        <!-- 送信ボタン -->
        <div class="text-center">
          <button type="submit" class="btn btn-primary btn-submit">
            <span class="submit-text">
              <i class="bi bi-send"></i>
              欠席連絡を送信
            </span>
            <span class="loading">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              送信中...
            </span>
          </button>
        </div>

        <!-- 結果表示エリア -->
        <div id="resultMessage" class="result-message"></div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // グローバル変数
    let courses = [];
    let isSubmitting = false;

    // ページ読み込み時の処理
    document.addEventListener('DOMContentLoaded', function() {
      loadCourses();
      initializeDateInputs();
      setupFormValidation();
      setupMobileOptimizations();
    });

    // 授業情報を読み込む
    function loadCourses() {
      google.script.run
        .withSuccessHandler(onCoursesLoaded)
        .withFailureHandler(onCoursesLoadError)
        .getCourses();
    }

    // 授業情報読み込み成功時の処理
    function onCoursesLoaded(courseData) {
      courses = courseData;
      renderSubjectsCheckboxes();
    }

    // 授業情報読み込み失敗時の処理
    function onCoursesLoadError(error) {
      console.error('授業情報の読み込みに失敗しました:', error);
      document.getElementById('subjectsContainer').innerHTML = `
        <div class="text-center p-4 text-danger">
          <i class="bi bi-exclamation-triangle"></i>
          <p class="mt-2">授業情報の読み込みに失敗しました。<br>ページを再読み込みしてください。</p>
        </div>
      `;
    }

    // 科目チェックボックスを生成
    function renderSubjectsCheckboxes() {
      const container = document.getElementById('subjectsContainer');
      
      if (courses.length === 0) {
        container.innerHTML = `
          <div class="text-center p-4 text-warning">
            <i class="bi bi-info-circle"></i>
            <p class="mt-2">授業情報が登録されていません。<br>管理者にお問い合わせください。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = courses.map((course, index) => `
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="subject_${index}" 
                 name="subjects" value="${course.courseName}">
          <label class="form-check-label" for="subject_${index}">
            <strong>${course.courseName}</strong><br>
            <small class="text-muted">${course.teacherName}先生</small>
          </label>
        </div>
      `).join('');
    }

    // 日付入力の初期化
    function initializeDateInputs() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').setAttribute('min', today);
      document.getElementById('endDate').setAttribute('min', today);

      // 開始日が変更されたら終了日の最小値を更新
      document.getElementById('startDate').addEventListener('change', function() {
        document.getElementById('endDate').setAttribute('min', this.value);
      });
    }

    // フォームバリデーションの設定
    function setupFormValidation() {
      const form = document.getElementById('absenceForm');
      form.addEventListener('submit', handleFormSubmit);
    }

    // フォーム送信処理
    async function handleFormSubmit(event) {
      event.preventDefault();
      
      if (isSubmitting) return;
      
      // バリデーション
      if (!validateForm()) {
        return;
      }

      isSubmitting = true;
      showLoading(true);

      // フォームデータの取得
      const formData = getFormData();

      // Google Apps Scriptに送信
      google.script.run
        .withSuccessHandler(onSubmitSuccess)
        .withFailureHandler(onSubmitError)
        .submitAbsence(formData);
    }

    // フォームバリデーション
    function validateForm() {
      const studentId = document.getElementById('studentId').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const studentEmail = document.getElementById('studentEmail').value.trim();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const selectedSubjects = document.querySelectorAll('input[name="subjects"]:checked');

      if (!studentId || !studentName || !studentEmail || !startDate || !endDate) {
        showMessage('error', '必須項目を入力してください。');
        return false;
      }

      // メールアドレスの形式チェック
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(studentEmail)) {
        showMessage('error', '正しいメールアドレスを入力してください。');
        return false;
      }

      if (selectedSubjects.length === 0) {
        showMessage('error', '欠席する科目を少なくとも1つ選択してください。');
        return false;
      }

      if (new Date(startDate) > new Date(endDate)) {
        showMessage('error', '終了日は開始日以降の日付を選択してください。');
        return false;
      }

      return true;
    }

    // フォームデータの取得
    function getFormData() {
      const selectedSubjects = Array.from(document.querySelectorAll('input[name="subjects"]:checked'))
        .map(checkbox => checkbox.value);

      return {
        studentId: document.getElementById('studentId').value.trim(),
        studentName: document.getElementById('studentName').value.trim(),
        studentEmail: document.getElementById('studentEmail').value.trim(),
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        reason: document.getElementById('reason').value.trim(),
        subjects: selectedSubjects
      };
    }

    // 送信成功時の処理
    function onSubmitSuccess(result) {
      isSubmitting = false;
      showLoading(false);

      if (result.success) {
        let message = `
          <div class="alert alert-success">
            <h5><i class="bi bi-check-circle"></i> 欠席連絡を送信しました</h5>
        `;

        if (result.emailsSent && result.emailsSent.length > 0) {
          message += `
            <p><strong>メール送信完了:</strong></p>
            <ul>
              ${result.emailsSent.map(subject => `<li>${subject}</li>`).join('')}
            </ul>
          `;
        }

        if (result.emailsNotSent && result.emailsNotSent.length > 0) {
          message += `
            <p class="text-warning"><strong>送信できませんでした:</strong></p>
            <ul>
              ${result.emailsNotSent.map(subject => `<li>${subject}</li>`).join('')}
            </ul>
          `;
        }

        message += '</div>';
        showMessage('success', message);

        // フォームをリセット
        setTimeout(() => {
          document.getElementById('absenceForm').reset();
          clearAllSubjects();
        }, 2000);

      } else {
        showMessage('error', result.error || '送信に失敗しました。');
      }
    }

    // 送信失敗時の処理
    function onSubmitError(error) {
      isSubmitting = false;
      showLoading(false);
      console.error('送信エラー:', error);
      showMessage('error', 'システムエラーが発生しました。時間をおいて再度お試しください。');
    }

    // ローディング表示の切り替え
    function showLoading(show) {
      const submitText = document.querySelector('.submit-text');
      const loading = document.querySelector('.loading');
      const submitButton = document.querySelector('.btn-submit');

      if (show) {
        submitText.style.display = 'none';
        loading.style.display = 'inline';
        submitButton.disabled = true;
      } else {
        submitText.style.display = 'inline';
        loading.style.display = 'none';
        submitButton.disabled = false;
      }
    }

    // メッセージ表示
    function showMessage(type, message) {
      const resultDiv = document.getElementById('resultMessage');
      resultDiv.innerHTML = message;
      resultDiv.className = `result-message alert ${type === 'error' ? 'alert-danger' : 'alert-success'}`;
      resultDiv.style.display = 'block';

      // 5秒後に自動で隠す（成功時のみ）
      if (type === 'success') {
        setTimeout(() => {
          resultDiv.style.display = 'none';
        }, 5000);
      }

      // メッセージの位置までスクロール
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // 全科目選択
    function selectAllSubjects() {
      document.querySelectorAll('input[name="subjects"]').forEach(checkbox => {
        checkbox.checked = true;
      });
    }

    // 全科目選択解除
    function clearAllSubjects() {
      document.querySelectorAll('input[name="subjects"]').forEach(checkbox => {
        checkbox.checked = false;
      });
    }

    // スマホ向けの最適化
    function setupMobileOptimizations() {
      // iOS Safariでのviewport問題の対応
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        document.addEventListener('focusin', function(e) {
          if (e.target.matches('input, textarea, select')) {
            setTimeout(() => {
              e.target.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center',
                inline: 'nearest'
              });
            }, 300);
          }
        });

        document.addEventListener('focusout', function(e) {
          if (e.target.matches('input, textarea, select')) {
            setTimeout(() => {
              window.scrollTo(0, window.scrollY);
            }, 100);
          }
        });
      }

      // チェックボックスのタッチ操作改善
      document.addEventListener('click', function(e) {
        if (e.target.closest('.form-check')) {
          const checkbox = e.target.closest('.form-check').querySelector('input[type="checkbox"]');
          if (checkbox && e.target !== checkbox) {
            checkbox.click();
          }
        }
      });

      // 送信ボタンの二重タップ防止
      const submitButton = document.querySelector('.btn-submit');
      if (submitButton) {
        submitButton.addEventListener('touchend', function(e) {
          e.preventDefault();
          if (!isSubmitting) {
            setTimeout(() => {
              submitButton.click();
            }, 50);
          }
        });
      }

      // パフォーマンス向上のためのpassiveイベントリスナー
      document.addEventListener('touchstart', function() {}, { passive: true });
      document.addEventListener('touchmove', function() {}, { passive: true });
    }
  </script>
</body>
</html>
